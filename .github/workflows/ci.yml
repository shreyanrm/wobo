name: CI

# Every push and PR on the working branches. `the-life` is the active build branch (Wave 2:
# production truth) — CI that never ran there was the gap this workflow closes.
on:
  push:
    branches: [main, the-life, "phase-*"]
  pull_request:
    branches: [main, the-life, "phase-*"]

# One run per branch; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14

jobs:
  js:
    name: JS (typecheck · lint · unit · web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bunx biome check .

      # Workspace unit suites: packages/* + apps/web-pwa (bun test, Playwright specs excluded by
      # the app's own `test` script filter).
      - run: bun run test

      # The web build is a compile gate, never deployed from here. The committed public flags in
      # apps/web-pwa/.env.production are overridden to the keyless mock provider so no CI artifact
      # is ever a live-mode bundle and the build needs no endpoints or keys.
      - name: Build web app
        working-directory: apps/web-pwa
        env:
          VITE_LLM_MODE: mock
          VITE_GATEWAY_URL: ""
        run: bun run build

  # The three brand gates (WOBO-PLAN §17 rebrand + white-label, §19 no gender). They are their own
  # job so a brand regression is legible on its own line and never hides inside a test summary.
  # Stdlib python3 only — no dependency install, so the job is a checkout plus one web build.
  gates:
    name: Brand gates (no-classess · white-label · pronouns)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is not needed: the gates read the working tree, never history.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The white-label gate reads the REAL bundle, built from the committed public flags — no
      # mock override here, unlike the `js` job's compile gate. A bundle built with the endpoints
      # blanked would hide exactly the vendor hostnames this gate exists to watch.
      - name: Build web app (the bundle the white-label gate reads)
        working-directory: apps/web-pwa
        run: bun run build

      - name: Gate — no-classess
        run: python3 scripts/gate_no_classess.py

      - name: Gate — white-label
        run: python3 scripts/gate_white_label.py

      - name: Gate — pronouns
        run: python3 scripts/gate_pronouns.py

  e2e:
    name: E2E (Playwright journey suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        working-directory: apps/web-pwa
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts owns the server: it starts vite on a strict port with
      # VITE_LLM_MODE=mock, no gateway, dev auth and local persistence — hermetic, no services.
      - name: Run journey suite
        working-directory: apps/web-pwa
        env:
          CI: "true"
        run: bun run test:e2e

      # The cancel, in a real browser. It cannot live in the journey suite: that one is hermetic
      # and fails the run if the page reaches any origin at all, and a cancel has no meaning
      # without a brain to cancel against — so this config starts its own dev server and stubs the
      # gateway with `page.route`. It ran by hand, from a README, in no job, which meant the only
      # end-to-end proof of the product's one door out was unwatched.
      - name: Run the cancel suite
        working-directory: apps/web-pwa
        env:
          CI: "true"
        run: bun run test:e2e:plan

      - name: Upload Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web-pwa/playwright-report
            apps/web-pwa/test-results
          retention-days: 7
          if-no-files-found: ignore

  python:
    name: Python (ruff · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      # One uv workspace at the repo root; --all-packages resolves every member service.
      - run: uv sync --all-packages

      - run: uvx ruff check services content

      - name: pytest — gateway
        run: uv run pytest -q services/gateway

      - name: pytest — verifier
        run: uv run pytest -q services/verifier

      - name: pytest — contracts
        run: uv run pytest -q services/contracts

      - name: pytest — content
        run: uv run pytest -q content

  render-worker:
    name: Render worker (bun test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-rw-${{ runner.os }}-${{ hashFiles('services/render-worker/bun.lock') }}
          restore-keys: bun-rw-${{ runner.os }}-

      # Deliberately not a workspace member (Remotion's heavy deps stay isolated), so it installs
      # and tests on its own.
      - name: Install
        working-directory: services/render-worker
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: services/render-worker
        run: bun test
