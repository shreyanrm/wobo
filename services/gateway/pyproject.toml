[project]
name = "wobo-gateway"
version = "0.0.0"
description = "Wobo model gateway — the single entry for all model calls (capability registry, two-track routing, three-tier cost economy)."
requires-python = ">=3.12"
dependencies = [
    # The live voice relay (voice.py) imports aiohttp for its two upstream websockets. It
    # arrived transitively via litellm; declared here so a litellm dependency change cannot
    # silently break the voice path.
    # The floor is 3.14.3, not 3.9: 3.14.1 shipped with PYSEC-2026-3545 (fixed in 3.14.3) and
    # PYSEC-2026-3546/3547 (fixed in 3.14.2), and this is a RUNTIME dependency on the live voice
    # path, not a build tool. A floor a resolver can satisfy with a known-vulnerable release is
    # not a floor.
    "aiohttp>=3.14.3",
    # wobo-contracts is NOT declared here: no gateway module imports it. The event contract
    # is validated where events are written — the client's SDK against @wobo/contracts — and
    # the gateway has no server-side ingest point to validate at. It still resolves into the
    # image transitively through wobo-verifier, so the mirror is there the day one appears.
    "wobo-verifier",
    "fastapi>=0.115",
    "litellm>=1.50",
    "pydantic>=2.7",
    # Identity at the door: Supabase JWTs, HS256 (legacy projects) or JWKS RS/ES (new ones).
    # [crypto] pulls `cryptography`, which the asymmetric verify path needs.
    "pyjwt[crypto]>=2.9",
    # Curriculum discovery reads official syllabus PDFs (curriculum/discovery/fetch.py). pypdf is
    # pure Python, so the image needs no poppler binary and the fetcher runs the same everywhere.
    # HTML is handled by the standard library's parser — no second dependency for that half.
    "pypdf>=5.1",
    "uvicorn[standard]>=0.30",
    "pillow>=11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wobo_gateway"]

[tool.uv.sources]
wobo-verifier = { workspace = true }
